# Documentation-only schema reference for bronze.weather (built by
# weather.sql). Not read by any tooling - BigQuery infers the actual
# schema from the CTAS query itself; this exists so the intended schema
# is reviewable without reverse-engineering it from the SELECT list.
# Pulled from the real deployed table (`bq show --schema`), not
# hand-typed from the query.
table: bronze.weather
description: >
  Normalized weather observations, collapsed to ONE row per city - the
  single most recent observation, by observed_at (the real-world
  observation time, not when the pipeline happened to poll). Not a time
  series; raw_data.import_weather (append-only) still holds the full
  history if that's ever needed. observed_at/ingested_at on each row
  describe that one kept observation, not "the latest of many still
  present here."
columns:
  - name: location_query
    type: STRING
    description: Query string sent to OpenWeatherMap, e.g. "Paris,FR".
  - name: city_name
    type: STRING
    description: City name as returned by the OpenWeatherMap API.
  - name: city_key
    type: STRING
    description: Accent-stripped, lowercased city_name - join key against bronze.air_quality.
  - name: country_key
    type: STRING
    description: ISO 3166-1 alpha-2 code, as returned by OpenWeatherMap (already clean).
  - name: latitude
    type: FLOAT
  - name: longitude
    type: FLOAT
  - name: observed_at
    type: TIMESTAMP
    description: Observation time reported by OpenWeatherMap (source field `dt`).
  - name: temperature_c
    type: FLOAT
  - name: feels_like_c
    type: FLOAT
  - name: humidity_pct
    type: INTEGER
  - name: pressure_hpa
    type: INTEGER
  - name: wind_speed_ms
    type: FLOAT
  - name: weather_main
    type: STRING
  - name: weather_description
    type: STRING
  - name: ingested_at
    type: TIMESTAMP
    description: When the ingestion pipeline fetched this record into raw_data (not the observation time).
  - name: _updated_at
    type: TIMESTAMP
    description: >
      When this bronze table was last rebuilt by the pipeline - distinct
      from ingested_at (that's about the underlying row's origin, this is
      about this table's own freshness). Internal/metadata column, hence
      the underscore prefix.
